name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal Apple Silicon Release
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build LiveWallpaper App & Screen Saver
        run: |
          chmod +x build_app.sh build_screensaver.sh create_installer.sh install.sh
          ./build_app.sh
          ./build_screensaver.sh

      - name: Create DMG & PKG Distribution Packages
        run: |
          ./create_installer.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.pkg
            dist/*.pkg.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
